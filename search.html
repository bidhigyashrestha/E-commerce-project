<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearShift Auto Parts | Search Parts</title>
  <style>
    :root {
      --bg: #081018;
      --panel: rgba(13, 23, 34, 0.84);
      --panel-border: rgba(255, 255, 255, 0.10);
      --text: #f3f7fb;
      --muted: #9fb0c2;
      --accent: #ff7a18;
      --accent-2: #ffb347;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      --field: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 122, 24, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(73, 145, 255, 0.16), transparent 30%),
        linear-gradient(160deg, #061019 0%, #0b1723 52%, #081018 100%);
      overflow-x: hidden;
    }

    .page {
      max-width: 1260px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 8px 0 24px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #121212;
      box-shadow: 0 12px 28px rgba(255, 122, 24, 0.35);
      overflow: hidden;
    }

    .brand-mark svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .brand-mark .logo-stroke {
      fill: none;
      stroke: #121212;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-mark .logo-fill {
      fill: #121212;
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }

    .nav a:hover { color: var(--text); }

    .shell {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 28px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 24px;
      align-items: start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 122, 24, 0.14);
      color: #ffd2ae;
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 4vw, 4.2rem);
      line-height: 0.98;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    .search-panel,
    .results-panel {
      border-radius: 24px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.04);
    }

    .search-toolbar {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-weight: 700;
      color: #d8e4ef;
      font-size: 0.94rem;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: var(--field);
      color: var(--text);
      outline: none;
      font: inherit;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .field input::placeholder {
      color: #8ea0b4;
    }

    .field select {
      cursor: pointer;
      appearance: none;
    }

    .field input:hover,
    .field input:focus,
    .field select:hover,
    .field select:focus {
      border-color: rgba(255, 122, 24, 0.55);
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }

    .field select option {
      background: #0d1722;
      color: #f3f7fb;
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      border-color: rgba(255, 122, 24, 0.45);
      background: rgba(255, 122, 24, 0.16);
      color: #ffd7b8;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .results-grid {
      display: grid;
      gap: 14px;
    }

    .result-card {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .result-card strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .result-card .category {
      color: #ffd2ae;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .result-card .details {
      color: var(--muted);
      line-height: 1.55;
    }

    .result-card .row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #d7e4ef;
      font-size: 0.94rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 14px;
      border: 0;
      background: linear-gradient(135deg, var(--accent) 0%, #ff9f43 55%, var(--accent-2) 100%);
      color: #1d1307;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 16px 30px rgba(255, 122, 24, 0.26);
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    .empty-state {
      padding: 20px;
      border-radius: 18px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" focusable="false" aria-label="Uploaded G gear logo">
            <defs>
              <mask id="g-cut-search">
                <rect width="100%" height="100%" fill="white" />
                <path d="M40 22 A10 10 0 1 0 24 34 L34 34" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              </mask>
            </defs>
            <g mask="url(#g-cut-search)" fill="#121212">
              <circle cx="32" cy="32" r="20"></circle>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(0 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(30 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(60 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(90 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(120 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(150 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(180 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(210 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(240 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(270 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(300 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(330 32 32)"></rect>
            </g>
          </svg>
        </div>
        GearShift Auto Parts
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="#results">Search results</a>
      </nav>
    </header>

    <section class="shell hero">
      <div>
        <div class="eyebrow" id="page-eyebrow">Search parts</div>
        <h1 id="page-title">Find the right parts fast</h1>
        <p id="page-copy">Use the search bar to filter parts by name, description, or category.</p>

        <div class="search-panel" style="margin-top: 22px;">
          <div class="search-toolbar">
            <div class="field">
              <label for="search-input">Search parts</label>
              <input id="search-input" type="search" placeholder="Search by part name or details" autocomplete="off">
            </div>
            <div class="field">
              <label for="vehicle-type">Vehicle type</label>
              <select id="vehicle-type">
                <option value="all">All vehicles</option>
                <option value="four-wheelers">Four Wheelers</option>
                <option value="two-wheelers">Two Wheelers</option>
              </select>
            </div>
            <div class="chips" id="category-chips"></div>
          </div>
          <div class="meta">
            <span id="result-count">0 results</span>
            <span id="active-context">Showing all categories</span>
          </div>
        </div>
      </div>

      <aside class="results-panel" id="results">
        <div class="results-header">
          <h2>Matching parts</h2>
          <a class="button secondary" href="index.html">Back to home</a>
        </div>
        <div class="results-grid" id="results-grid"></div>
        <div class="empty-state hidden" id="empty-state">No parts match your search. Try a different keyword or category.</div>
      </aside>
    </section>
  </main>

  <script>
    const catalog = {
      'four-wheelers': {
        eyebrow: 'Four Wheeler Parts',
        title: 'Search four wheeler parts',
        copy: 'Browse the parts you have added for four wheelers.',
        categories: [
          { slug: 'all', label: 'All categories' },
          { slug: 'engine-parts', label: 'Engine parts' },
          { slug: 'brakes-suspension', label: 'Brakes & suspension' },
          { slug: 'electrical', label: 'Electrical' },
          { slug: 'accessories', label: 'Accessories' }
        ]
      },
      'two-wheelers': {
        eyebrow: 'Two Wheeler Parts',
        title: 'Search two wheeler parts',
        copy: 'Browse the parts you have added for two wheelers.',
        categories: [
          { slug: 'all', label: 'All categories' },
          { slug: 'engine-parts', label: 'Engine parts' },
          { slug: 'brakes-suspension', label: 'Brakes & suspension' },
          { slug: 'electrical', label: 'Electrical' },
          { slug: 'accessories', label: 'Accessories' }
        ]
      }
    };

    const pageEyebrow = document.getElementById('page-eyebrow');
    const pageTitle = document.getElementById('page-title');
    const pageCopy = document.getElementById('page-copy');
    const searchInput = document.getElementById('search-input');
    const vehicleType = document.getElementById('vehicle-type');
    const categoryChips = document.getElementById('category-chips');
    const resultCount = document.getElementById('result-count');
    const activeContext = document.getElementById('active-context');
    const resultsGrid = document.getElementById('results-grid');
    const emptyState = document.getElementById('empty-state');

    let activeCategory = 'all';
    let loadedParts = [];

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function slugifyCategory(value) {
      return String(value).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function requestHeaders() {
      const sessionUser = JSON.parse(sessionStorage.getItem('gearshift-session-user') || 'null');
      if (!sessionUser) {
        return null;
      }

      return {
        'Content-Type': 'application/json',
        'X-User-Email': sessionUser.email
      };
    }

    function inferCategory(part) {
      const haystack = `${part.name || ''} ${part.description || ''}`.toLowerCase();
      if (/(engine|spark|filter|belt|piston|clutch|oil)/.test(haystack)) {
        return 'engine-parts';
      }
      if (/(brake|suspension|shock|pad|disc|fork)/.test(haystack)) {
        return 'brakes-suspension';
      }
      if (/(electrical|battery|light|lamp|bulb|sensor|wire|ignition|indicator)/.test(haystack)) {
        return 'electrical';
      }
      if (/(accessor|mirror|guard|rack|phone mount|seat|cover)/.test(haystack)) {
        return 'accessories';
      }

      return 'all';
    }

    function inferVehicleType(part) {
      const haystack = `${part.name || ''} ${part.description || ''}`.toLowerCase();
      if (/(bike|bikes|scooter|scooters|motorcycle|helmet|handlebar)/.test(haystack)) {
        return 'two-wheelers';
      }

      if (/(car|cars|truck|trucks|roof|sedan|suv|dashboard)/.test(haystack)) {
        return 'four-wheelers';
      }

      return vehicleType.value === 'all' ? 'four-wheelers' : vehicleType.value;
    }

    function getSelectedCatalog() {
      return catalog[vehicleType.value] || {
        eyebrow: 'Search parts',
        title: 'Find the right parts fast',
        copy: 'Use the search bar to filter parts by name or description.',
        categories: [{ slug: 'all', label: 'All categories' }]
      };
    }

    function renderChips() {
      const selectedCatalog = getSelectedCatalog();
      categoryChips.innerHTML = selectedCatalog.categories.map((category) => `
        <button class="chip ${activeCategory === category.slug ? 'active' : ''}" type="button" data-category="${category.slug}">${category.label}</button>
      `).join('');
    }

    function normalizePart(part) {
      const vehicle = inferVehicleType(part);
      const category = inferCategory(part);
      return {
        ...part,
        vehicleType: vehicle,
        categorySlug: category,
        displayCategory: category.replace(/-/g, ' ')
      };
    }

    function renderResults() {
      const query = searchInput.value.trim().toLowerCase();
      const categoryFilter = activeCategory === 'all' ? null : activeCategory;
      const selectedVehicle = vehicleType.value;

      const filtered = loadedParts.filter((item) => {
        const matchesVehicle = selectedVehicle === 'all' || item.vehicleType === selectedVehicle;
        const matchesQuery = !query || [item.name, item.description].some((field) => String(field || '').toLowerCase().includes(query));
        const matchesCategory = !categoryFilter || item.categorySlug === categoryFilter;
        return matchesVehicle && matchesQuery && matchesCategory;
      });

      resultCount.textContent = `${filtered.length} result${filtered.length === 1 ? '' : 's'}`;
      activeContext.textContent = vehicleType.value === 'all'
        ? 'Showing all vehicle types'
        : `Filtered to ${vehicleType.value.replace('-', ' ')}`;

      if (!filtered.length) {
        resultsGrid.innerHTML = '';
        emptyState.textContent = loadedParts.length ? 'No parts match your search. Try a different keyword or category.' : 'No saved parts yet. Add parts from the dashboard to search them here.';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      resultsGrid.innerHTML = filtered.map((item) => `
        <article class="result-card">
          <div class="category">${escapeHtml(item.displayCategory)}</div>
          <strong>${escapeHtml(item.name)}</strong>
          <div class="details">${escapeHtml(item.description)}</div>
          <div class="row">
            <span>${escapeHtml(item.vehicleType.replace('-', ' '))}</span>
            <span>$${Number(item.price).toFixed(2)}</span>
          </div>
        </article>
      `).join('');
    }

    function syncPageCopy() {
      const selectedCatalog = getSelectedCatalog();
      pageEyebrow.textContent = selectedCatalog.eyebrow;
      pageTitle.textContent = selectedCatalog.title;
      pageCopy.textContent = selectedCatalog.copy;
    }

    function applyQueryDefaults() {
      const params = new URLSearchParams(window.location.search);
      const vehicle = params.get('vehicle');
      const category = params.get('category');

      if (vehicle && catalog[vehicle]) {
        vehicleType.value = vehicle;
      }

      if (category) {
        activeCategory = category;
      }
    }

    async function loadParts() {
      const headers = requestHeaders();
      if (!headers) {
        loadedParts = [];
        renderResults();
        return;
      }

      const response = await fetch('/api/parts', { headers });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Unable to load parts.');
      }

      loadedParts = (data.parts || []).map((part) => normalizePart(part));

      renderResults();
    }

    categoryChips.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-category]');
      if (!button) {
        return;
      }

      const category = button.getAttribute('data-category');
      activeCategory = category;
      renderChips();
      renderResults();
    });

    searchInput.addEventListener('input', renderResults);
    vehicleType.addEventListener('change', () => {
      activeCategory = 'all';
      syncPageCopy();
      renderChips();
      loadParts().catch(() => {
        loadedParts = [];
        renderResults();
      });
    });

    applyQueryDefaults();
    syncPageCopy();
    renderChips();
    loadParts().catch(() => {
      loadedParts = [];
      renderResults();
    });
  </script>
</body>
</html>
