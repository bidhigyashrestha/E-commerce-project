<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearShift Auto Parts | Product Details</title>
  <style>
    :root {
      --bg: #081018;
      --panel: rgba(13, 23, 34, 0.86);
      --panel-border: rgba(255, 255, 255, 0.10);
      --text: #f3f7fb;
      --muted: #9fb0c2;
      --accent: #ff7a18;
      --accent-2: #ffb347;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 122, 24, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(84, 171, 255, 0.16), transparent 30%),
        linear-gradient(160deg, #061019 0%, #0b1723 52%, #081018 100%);
      overflow-x: hidden;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 8px 0 24px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #121212;
      box-shadow: 0 12px 28px rgba(255, 122, 24, 0.35);
      overflow: hidden;
    }

    .brand-mark svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .brand-mark .logo-stroke {
      fill: none;
      stroke: #121212;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-mark .logo-fill {
      fill: #121212;
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }

    .nav a:hover { color: var(--text); }

    .shell {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 28px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 24px;
      align-items: start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 122, 24, 0.14);
      color: #ffd2ae;
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 4vw, 4.2rem);
      line-height: 0.98;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    .panel {
      border-radius: 24px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.04);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .details-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .image-panel {
      margin-bottom: 18px;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 220px;
    }

    .image-panel img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 320px;
      object-fit: cover;
    }

    .image-panel .fallback {
      min-height: 220px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 18px;
    }

    .details-item {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .details-item label {
      display: block;
      color: #d6e2ee;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    .details-item strong {
      display: block;
      word-break: break-word;
    }

    .meta {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .meta label {
      display: block;
      color: #d6e2ee;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    .meta strong {
      display: block;
      word-break: break-word;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 14px;
      border: 0;
      background: linear-gradient(135deg, var(--accent) 0%, #ff9f43 55%, var(--accent-2) 100%);
      color: #1d1307;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 16px 30px rgba(255, 122, 24, 0.26);
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .quantity-row {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .quantity-row input {
      width: 110px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
    }

    .price {
      margin-top: 14px;
      font-size: 1.2rem;
      color: #ffd2ae;
      font-weight: 800;
    }

    .status {
      margin-top: 16px;
      color: var(--muted);
      min-height: 24px;
    }

    .error {
      color: #ffb2a6;
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" focusable="false" aria-label="Uploaded G gear logo">
            <defs>
              <mask id="g-cut-details">
                <rect width="100%" height="100%" fill="white" />
                <path d="M40 22 A10 10 0 1 0 24 34 L34 34" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              </mask>
            </defs>
            <g mask="url(#g-cut-details)" fill="#121212">
              <circle cx="32" cy="32" r="20"></circle>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(0 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(30 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(60 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(90 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(120 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(150 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(180 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(210 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(240 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(270 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(300 32 32)"></rect>
              <rect x="31" y="2" width="2.6" height="6" rx="0.8" transform="rotate(330 32 32)"></rect>
            </g>
          </svg>
        </div>
        GearShift Auto Parts
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </header>

    <section class="shell hero">
      <div>
        <div class="eyebrow" id="detail-eyebrow">Product details</div>
        <h1 id="detail-title">Loading product...</h1>
        <p id="detail-copy">This page loads live product data from the marketplace.</p>

        <div class="actions">
          <a class="button secondary" href="index.html">Back to home</a>
          <a class="button" href="search.html">Search more parts</a>
        </div>
        <div class="quantity-row">
          <label for="buy-quantity" style="color: var(--muted); font-weight: 700;">Quantity</label>
          <input id="buy-quantity" type="number" min="1" step="1" value="1">
          <button class="button" type="button" id="buy-button">Buy now</button>
        </div>
      </div>

      <aside class="panel" id="detail-panel">
        <div class="image-panel" id="detail-image-panel">
          <div class="fallback">No product image available.</div>
        </div>
        <div class="meta-grid">
          <div class="meta">
            <label>Part</label>
            <strong id="detail-name">-</strong>
          </div>
          <div class="meta">
            <label>Price</label>
            <strong id="detail-price">-</strong>
          </div>
          <div class="meta">
            <label>Category</label>
            <strong id="detail-category">-</strong>
          </div>
          <div class="meta">
            <label>Updated</label>
            <strong id="detail-updated">-</strong>
          </div>
        </div>
          <div class="details-list" id="detail-extra-list"></div>
        <div class="price" id="detail-owner">-</div>
        <div class="status" id="buy-status" aria-live="polite"></div>
        <div class="status" id="detail-status" aria-live="polite"></div>
      </aside>
    </section>
  </main>

  <script>
    const detailEyebrow = document.getElementById('detail-eyebrow');
    const detailTitle = document.getElementById('detail-title');
    const detailCopy = document.getElementById('detail-copy');
    const detailName = document.getElementById('detail-name');
    const detailPrice = document.getElementById('detail-price');
    const detailCategory = document.getElementById('detail-category');
    const detailUpdated = document.getElementById('detail-updated');
    const detailExtraList = document.getElementById('detail-extra-list');
    const detailImagePanel = document.getElementById('detail-image-panel');
    const detailOwner = document.getElementById('detail-owner');
    const buyQuantity = document.getElementById('buy-quantity');
    const buyButton = document.getElementById('buy-button');
    const buyStatus = document.getElementById('buy-status');
    const detailStatus = document.getElementById('detail-status');
    let activePartId = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatPrice(price) {
      const numeric = Number(price);
      return Number.isFinite(numeric) ? `$${numeric.toFixed(2)}` : String(price);
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value || '-') : date.toLocaleString();
    }

    function renderExtraField(label, value) {
      return `
        <div class="details-item">
          <label>${label}</label>
          <strong>${escapeHtml(value || '-')}</strong>
        </div>
      `;
    }

    function renderImagePanel(part) {
      if (!part.image_data) {
        detailImagePanel.innerHTML = '<div class="fallback">No product image available.</div>';
        return;
      }

      detailImagePanel.innerHTML = `<img src="${part.image_data}" alt="${escapeHtml(part.image_name || part.name || 'Product image')}">`;
    }

    function inferCategory(part) {
      const haystack = `${part.name || ''} ${part.description || ''}`.toLowerCase();
      if (/(engine|spark|filter|belt|piston|clutch|oil)/.test(haystack)) {
        return 'Engine parts';
      }

      if (/(brake|suspension|shock|pad|disc|fork)/.test(haystack)) {
        return 'Brakes & suspension';
      }

      if (/(electrical|battery|light|lamp|bulb|sensor|wire|ignition|indicator)/.test(haystack)) {
        return 'Electrical';
      }

      if (/(accessor|mirror|guard|rack|phone mount|seat|cover)/.test(haystack)) {
        return 'Accessories';
      }

      return 'Marketplace part';
    }

    async function loadPart() {
      const params = new URLSearchParams(window.location.search);
      const partId = params.get('part');

      if (partId) {
        const response = await fetch(`/api/public/parts/${encodeURIComponent(partId)}`);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Unable to load the selected product.');
        }

        return data.part;
      }

      const response = await fetch('/api/homepage');
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'Unable to load homepage product.');
      }

      return data.spotlightPart || null;
    }

    function renderEmptyState() {
      detailEyebrow.textContent = 'Product details';
      detailTitle.textContent = 'No product selected';
      detailCopy.textContent = 'An admin can choose any product to appear on the home page, or you can open a part from the featured and trending lists.';
      detailName.textContent = '-';
      detailPrice.textContent = '-';
      detailCategory.textContent = '-';
      detailUpdated.textContent = '-';
      detailOwner.textContent = 'No live product available right now';
      detailStatus.textContent = '';
      buyStatus.textContent = '';
      buyButton.disabled = true;
    }

    function setBuyStatus(message, isError = false) {
      buyStatus.textContent = message;
      buyStatus.classList.toggle('error', isError);
    }

    async function buyCurrentPart() {
      if (!activePartId) {
        setBuyStatus('No product selected.', true);
        return;
      }

      const quantity = Number(buyQuantity.value || 1);
      if (!Number.isFinite(quantity) || quantity < 1) {
        setBuyStatus('Enter a valid quantity.', true);
        return;
      }

      const response = await fetch('/api/purchases', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-User-Email': sessionStorage.getItem('gearshift-session-user') ? JSON.parse(sessionStorage.getItem('gearshift-session-user')).email : ''
        },
        body: JSON.stringify({ partId: activePartId, quantity })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'Unable to complete purchase.');
      }

      setBuyStatus(`Purchased ${data.purchase.quantity} item(s) for ${formatPrice(data.purchase.totalPrice)}.`);
      if (data.part) {
        detailOwner.textContent = `Owner: ${escapeHtml(data.part.owner_email || 'Unknown')}`;
        detailStatus.textContent = `Remaining stock: ${data.part.stock_quantity}`;
      }
    }

    loadPart()
      .then((part) => {
        if (!part) {
          renderEmptyState();
          return;
        }

        activePartId = part.id;

        detailTitle.textContent = part.name;
        detailCopy.textContent = part.description;
        detailName.textContent = part.name;
        detailPrice.textContent = formatPrice(part.price);
        detailCategory.textContent = inferCategory(part);
        detailUpdated.textContent = formatDate(part.updated_at || part.created_at);
        detailOwner.textContent = `Owner: ${escapeHtml(part.owner_email || 'Unknown')}`;
        renderImagePanel(part);
        detailExtraList.innerHTML = [
          renderExtraField('Part ID', `GS-${String(part.id).padStart(6, '0')}`),
          renderExtraField('Vehicle type', part.vehicle_type),
          renderExtraField('Brand', part.brand),
          renderExtraField('Compatible model', part.model),
          renderExtraField('Condition', part.condition),
          renderExtraField('Stock quantity', part.stock_quantity),
          renderExtraField('Warranty', part.warranty)
        ].join('');
        buyButton.disabled = false;
      })
      .catch((error) => {
        renderEmptyState();
        detailStatus.textContent = error.message;
        detailStatus.classList.add('error');
      });

    buyButton.addEventListener('click', () => {
      buyCurrentPart().catch((error) => setBuyStatus(error.message, true));
    });
  </script>
</body>
</html>
